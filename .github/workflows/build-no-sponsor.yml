name: Build no-sponsor-alert APK

# 构建已移除「启动100次赞助提醒」弹窗的 APK
# 触发方式:
#   1. workflow_dispatch 手动触发 (网页 Actions 页面)
#   2. push 到 main 且本文件有改动 ( Paths 过滤: 日常上游自动合并不会重复触发 )
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-no-sponsor.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web-ui

      - name: Configure release signing (local.properties)
        run: |
          cat > local.properties <<EOF
          storeFile=${{ github.workspace }}/app/keystore/release.keystore
          storePassword=Rikka#Local#2026
          keyAlias=rikkahub
          keyPassword=Rikka#Local#2026
          EOF

      - name: Compute version and timestamp
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          TS=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
          echo "version=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*-release*.apk" | while read -r f; do
            ABI=$(basename "$f" .apk)
            ABI=${ABI#app-}
            ABI=${ABI%-release}
            cp -v "$f" "dist/RikkaHub-no-sponsor-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.ts }}-${ABI}.apk"
          done
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-no-sponsor-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.ts }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "no-sponsor-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.ts }}"
          name: "RikkaHub v${{ steps.meta.outputs.version }} 无赞助弹窗版"
          prerelease: true
          body: |
            基于 `main` 分支构建（commit ${{ github.sha }}）。

            改动：移除设置页「已启动应用超过 100 次，请考虑支持开发者」提醒弹窗（`SettingPage.kt`）。
          files: dist/*.apk
          fail_on_unmatched_files: true
