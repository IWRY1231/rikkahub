name: Sync upstream & build

# 每天(UTC 03:00 / 北京时间 11:00)自动同步原版 rikkahub, 合并成功则构建 APK 并发布 Release;
# 出现冲突则自动创建 Issue 提示手动处理。
# 手动触发: Actions -> Sync upstream & build -> Run workflow
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: "https://github.com/rikkahub/rikkahub.git"
  UPSTREAM_BRANCH: "master"
  TARGET_BRANCH: "main"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          # material3 模块的 dynamiccolor 源码来自 git 子模块, 必须拉取
          submodules: recursive

      - name: Merge upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

          UPSTREAM_HEAD="$(git rev-parse upstream/$UPSTREAM_BRANCH)"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Upstream has no new commits."
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            # 手动触发(workflow_dispatch)时也执行构建, 便于随时拿到最新 APK
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
            else
              echo "updated=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git push origin "$TARGET_BRANCH"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            git diff --name-only "$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH")" "upstream/$UPSTREAM_BRANCH" > changed-by-upstream.txt || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue when conflicts need manual work
        if: steps.sync.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let changed = '';
            try { changed = fs.readFileSync('changed-by-upstream.txt', 'utf8'); } catch (e) {}
            const marker = '<!-- sync-upstream-conflict -->';
            const title = '上游同步冲突：需要手动合并 rikkahub/master';
            const body = `${marker}
            自动同步时 \`git merge upstream/master\` 产生冲突，本分支的「工作区本地互通」功能补丁需要手动解决冲突。

            ## 本地处理步骤

            \`\`\`bash
            git clone https://github.com/${context.repo.owner}/${context.repo.repo}.git
            cd ${context.repo.repo}
            git remote add upstream https://github.com/rikkahub/rikkahub.git
            git fetch upstream master
            git merge upstream/master
            # 逐个解决冲突后:
            git commit && git push
            \`\`\`

            ## 本功能最可能冲突的文件（解决冲突时参考 docs/PORT.md）

            - app/src/main/AndroidManifest.xml （权限声明附近）
            - app/.../di/RepositoryModule.kt （WorkspaceManager 的 bindMounts）
            - app/.../di/DataSourceModule.kt （addMigrations 列表）
            - app/.../data/db/AppDatabase.kt （数据库版本号）
            - workspace/.../WorkspaceManager.kt （resolveRootfsPath/executeCommand 签名）
            - app/.../data/ai/tools/WorkspaceTools.kt （工具描述与 WRITABLE_ROOT_PREFIXES）
            - app/.../data/ai/transformers/WorkspaceReminderTransformer.kt
            - app/.../ui/pages/extensions/workspace/WorkspaceDetailPage.kt

            ## 上游本次变更的文件

            \`\`\`
            ${changed || '(无法列出)'}
            \`\`\`
            `;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title && i.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
              });
            }

      - name: Checkout merged result
        if: steps.sync.outputs.updated == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          submodules: recursive

      - name: Write google-services.json from secret
        if: steps.sync.outputs.updated == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON not set. 原版要求 app/google-services.json 才能构建，本次跳过构建。可在仓库 Settings -> Secrets 添加该文件内容。"
          fi
          [ -f app/google-services.json ] || echo "skip_build=true" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        run: pnpm install --frozen-lockfile
        working-directory: web-ui

      - name: Configure release signing (local.properties)
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        run: |
          cat > local.properties <<EOF
          storeFile=${{ github.workspace }}/app/keystore/release.keystore
          storePassword=Rikka#Local#2026
          keyAlias=rikkahub
          keyPassword=Rikka#Local#2026
          EOF

      - name: Compute version and timestamp
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          TS=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
          echo "version=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"
          echo "ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        run: |
          mkdir -p dist
          # splits.abi 会产出 arm64-v8a / x86_64 / universal 三个 APK, 全部收集并标明架构
          find app/build/outputs/apk -name "*-release*.apk" | while read -r f; do
            ABI=$(basename "$f" .apk)
            ABI=${ABI#app-}
            ABI=${ABI%-release}
            cp -v "$f" "dist/RikkaHub-local-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.ts }}-${ABI}.apk"
          done
          ls -la dist

      - name: Upload artifact
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-local-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.ts }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create release
        if: steps.sync.outputs.updated == 'true' && env.skip_build != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "RikkaHub-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.ts }}-r${{ github.run_number }}"
          name: "RikkaHub v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.ts }})"
          body: |
            基于 rikkahub/rikkahub@${{ steps.sync.outputs.upstream_head }} 自动合并后构建
          files: dist/*.apk
          fail_on_unmatched_files: true
